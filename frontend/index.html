<!DOCTYPE html>
<html>

<head>
    <title>Secure Login</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <h1>Secure Login</h1>

        <input
            type="text"
            id="phone"
            placeholder="Enter Phone Number">

        <input
            type="password"
            id="pin"
            placeholder="Enter PIN">

        <button id="loginBtn">
            Login
        </button>

        <p id="message"></p>

    </div>

    <script src="/index.js"></script>

</body>
</html>
