<!DOCTYPE html>

<html>

<head>

    <title>OTP Verification</title>

</head>

<body>

    <h1>OTP Verification</h1>

    <p>
        Enter the 6-digit verification code.
    </p>


    <input
        type="text"
        id="otp"
        maxlength="6"
        inputmode="numeric"
        placeholder="Enter OTP"
    >


    <button id="verifyBtn">

        Verify OTP

    </button>


    <p id="message"></p>


    <script src="otp.js"></script>

</body>

</html>
